<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greffe — remplace un élément, garde tout le reste</title>
<meta name="description" content="Envoie une photo, décris ce qu'il faut remplacer. Le reste de l'image ne bouge pas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1210;
    --surface:#131f19;
    --surface-2:#1b2b22;
    --line:#28392f;
    --amber:#e8a94a;
    --teal:#4fb8c4;
    --text:#edeae3;
    --muted:#8a9289;
    --error:#c1502e;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  em{font-family:'Fraunces',serif;font-style:italic;color:var(--amber);}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.12em;
    color:var(--teal);
    text-transform:uppercase;
    margin:0 0 0.6rem 0;
  }
  .chrome{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1.1rem 1.25rem;
    border-bottom:1px solid var(--line);
  }
  .mark{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    letter-spacing:0.08em;
    font-size:0.95rem;
  }
  .mark::before{content:"✛ ";color:var(--amber);}
  .chrome .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    color:var(--muted);
  }
  main{max-width:560px;margin:0 auto;padding:0 1.25rem 3rem;}
  .hero{padding:2.6rem 0 2rem;}
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:2rem;
    line-height:1.18;
    margin:0 0 1rem;
  }
  .hero .sub{color:var(--muted);font-size:0.98rem;line-height:1.55;margin:0;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.25rem;
    margin-bottom:1.5rem;
  }

  .slot{
    position:relative;
    aspect-ratio:4/3;
    background:var(--surface-2);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:pointer;
    margin-bottom:1.1rem;
  }
  .slot img{width:100%;height:100%;object-fit:cover;}
  #placeholder{text-align:center;color:var(--muted);pointer-events:none;}
  #placeholder .crosshair{
    display:block;font-size:1.6rem;color:var(--amber);margin-bottom:0.4rem;
  }
  #placeholder p{margin:0;font-size:0.9rem;}

  .field-label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:0.5rem;
  }
  input[type="text"]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:1rem;
    padding:0.8rem 0.9rem;
    margin-bottom:1.1rem;
  }
  input[type="text"]:focus{outline:2px solid var(--teal);outline-offset:1px;}
  input[type="text"]::placeholder{color:var(--muted);}

  button{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    letter-spacing:0.04em;
    border-radius:var(--radius);
    padding:0.85rem 1rem;
    border:1px solid transparent;
    width:100%;
    cursor:pointer;
  }
  button:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  #operateBtn{
    background:var(--amber);
    color:#1a1206;
    font-weight:500;
    text-transform:uppercase;
  }
  #operateBtn:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;}
  .ghost{
    background:transparent;
    border-color:var(--line);
    color:var(--text);
    margin-top:0.7rem;
  }

  .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--muted);
